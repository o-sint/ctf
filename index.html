<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OSINT CTF</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#131a2b; --panel2:#0f1524; --line:#243049;
    --ink:#e6ecff; --dim:#8090b3; --acc:#37e0a0; --acc2:#4aa3ff; --warn:#ff6b6b; --gold:#ffcf5c;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  a{color:var(--acc2)}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:14px}
  .brand{font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.5px}
  .brand .b{color:var(--acc)}
  .status{font-family:var(--mono);font-size:13px;color:var(--dim);text-align:right}
  .status .clock{color:var(--gold);font-size:16px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}
  .pill.live{color:var(--acc);border-color:var(--acc)}
  .pill.pre{color:var(--acc2);border-color:var(--acc2)}
  .pill.post{color:var(--warn);border-color:var(--warn)}

  .idbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  input,button{font-family:var(--mono);font-size:14px}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:9px 11px;border-radius:8px;outline:none}
  input[type=text]:focus{border-color:var(--acc2)}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    padding:9px 13px;border-radius:8px}
  button:hover{border-color:var(--acc2)}
  button.primary{background:var(--acc);color:#04150e;border-color:var(--acc);font-weight:700}
  button.ghost{background:transparent}
  button.danger{color:var(--warn);border-color:#3a2330}
  .who{font-family:var(--mono)}
  .who b{color:var(--acc)}

  h2{font-family:var(--mono);font-size:14px;color:var(--dim);text-transform:none;letter-spacing:1px;
    margin:26px 0 10px;font-weight:600}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;font-size:14px}
  th{color:var(--dim);font-family:var(--mono);font-weight:600;font-size:12px;background:var(--panel2)}
  tr+tr td{border-top:1px solid var(--line)}
  td.pts,th.pts{text-align:right;font-family:var(--mono)}
  .rank{font-family:var(--mono);color:var(--dim);width:44px}
  .rank.r1{color:var(--gold)} .rank.r2{color:#cbd5e1} .rank.r3{color:#d19a66}
  .me td{background:rgba(55,224,160,.06)}

  .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .cat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .cat h3{margin:0 0 10px;font-family:var(--mono);font-size:13px;color:var(--acc2);letter-spacing:.5px}
  .tiles{display:flex;flex-direction:column;gap:8px}
  .tile{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer}
  .tile:hover{border-color:var(--acc2)}
  .tile .t{font-size:14px}
  .tile .v{font-family:var(--mono);font-size:13px;color:var(--gold)}
  .tile.solved{border-color:var(--acc)}
  .tile.solved .t::before{content:"✓ ";color:var(--acc)}
  .tile.solved .v{color:var(--acc)}
  .sub{font-size:11px;color:var(--dim);font-family:var(--mono)}

  .modal{position:fixed;inset:0;background:rgba(3,6,14,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.open{display:flex}
  .card{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card .cat-lbl{font-family:var(--mono);font-size:12px;color:var(--acc2)}
  .card h3{margin:4px 0 2px;font-size:20px}
  .card .val{font-family:var(--mono);color:var(--gold);font-size:13px}
  .prompt{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:12px;margin:14px 0;font-size:14px}
  .prompt a{word-break:break-all}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row input[type=text]{flex:1;min-width:180px}
  .msg{font-family:var(--mono);font-size:13px;min-height:18px;margin-top:8px}
  .msg.ok{color:var(--acc)} .msg.bad{color:var(--warn)} .msg.info{color:var(--dim)}
  .hintbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .hintbox .h{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
  .x{float:right;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
  .reveal{margin:8px 0 22px}
  .foot{color:var(--dim);font-size:12px;font-family:var(--mono);text-align:center;margin:28px 0 8px}
  @media(max-width:520px){.status{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">osint<span class="b">//</span>ctf</div>
    <div class="status" id="status">
      <div id="evname">—</div>
      <div class="clock" id="clock">--:--:--</div>
      <div><span class="pill" id="phase">…</span></div>
    </div>
  </header>

  <div class="idbar" id="idbar">
    <!-- filled by JS -->
  </div>

  <h2>Leaderboard</h2>
  <table id="board"><thead><tr><th class="rank">#</th><th>Player</th><th class="pts">Points</th></tr></thead><tbody></tbody></table>

  <div class="reveal" id="revealWrap" style="display:none">
    <button id="revealBtn" class="ghost">Reveal answers</button>
  </div>

  <h2>Challenges</h2>
  <div id="chArea"><div class="sub" id="chNote">loading…</div><div class="catgrid" id="cats"></div></div>

  <div class="foot">no accounts · username stored in your browser · clearing site data resets your identity</div>
</div>

<div class="modal" id="modal">
  <div class="card" id="modalCard"></div>
</div>

<script>
/* ============ CONFIG ============ */
const API = "/api"; // same host as GitHub Pages via Worker route. If using a separate api subdomain, set full URL e.g. "https://ctf-api.example.com/api"
/* ================================ */

const $ = (s,r=document)=>r.querySelector(s);
const uuidKey="ctf_uuid", nameKey="ctf_name";
let UUID = localStorage.getItem(uuidKey);
if(!UUID){ UUID = (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()); localStorage.setItem(uuidKey,UUID); }
let NAME = localStorage.getItem(nameKey) || "";
let STATE=null, CH=[];

async function api(path,opts={}){
  const r = await fetch(API+path,{headers:{"Content-Type":"application/json"},...opts});
  const j = await r.json().catch(()=>({error:"bad response"}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
const fmt=(ms)=>{ if(ms<0)ms=0; const s=Math.floor(ms/1000); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return [h,m,ss].map(x=>String(x).padStart(2,"0")).join(":"); };

function renderIdbar(){
  const bar=$("#idbar");
  if(NAME){
    bar.innerHTML=`<span class="who">playing as <b>${esc(NAME)}</b></span>
      <button id="editName" class="ghost">Change name</button>
      <button id="delName" class="danger">Remove me</button>`;
    $("#editName").onclick=()=>promptName(NAME);
    $("#delName").onclick=removeMe;
  }else{
    bar.innerHTML=`<input type="text" id="nameIn" placeholder="pick a username" maxlength="24" />
      <button id="joinBtn" class="primary">Join</button>
      <span class="sub" id="joinMsg"></span>`;
    $("#joinBtn").onclick=()=>promptName($("#nameIn").value);
    $("#nameIn").onkeydown=(e)=>{if(e.key==="Enter")promptName($("#nameIn").value);};
  }
}
async function promptName(v){
  const name=(v||"").trim(); if(!name) return;
  try{
    const j=await api("/register",{method:"POST",body:JSON.stringify({uuid:UUID,name})});
    NAME=j.name; localStorage.setItem(nameKey,NAME); renderIdbar(); loadBoard();
  }catch(e){ const m=$("#joinMsg"); if(m){m.textContent=e.message;m.className="sub bad";} else alert(e.message); }
}
async function removeMe(){
  if(!confirm("Remove your username and all your solves?")) return;
  try{ await api("/unregister",{method:"POST",body:JSON.stringify({uuid:UUID})}); }catch(e){}
  NAME=""; localStorage.removeItem(nameKey); renderIdbar(); loadBoard(); loadChallenges();
}

async function loadState(){
  STATE=await api("/state");
  $("#evname").textContent=STATE.name||"(unnamed event)";
  const ph=$("#phase"); ph.className="pill "+STATE.phase;
  const c=$("#clock");
  const drift=Date.now()-STATE.now;
  if(STATE.phase==="pre"){ph.textContent="starts soon"; c.textContent=fmt(STATE.start-(Date.now()-drift));}
  else if(STATE.phase==="live"){ph.textContent="LIVE"; c.textContent=fmt(STATE.end-(Date.now()-drift));}
  else if(STATE.phase==="post"){ph.textContent="ended"; c.textContent="00:00:00";}
  else{ph.textContent="not scheduled"; c.textContent="--:--:--";}
  $("#revealWrap").style.display = STATE.phase==="post" ? "block":"none";
}
async function loadBoard(){
  const j=await api("/leaderboard");
  const tb=$("#board tbody"); tb.innerHTML="";
  j.board.forEach((row,i)=>{
    const tr=document.createElement("tr");
    if(row.name===NAME) tr.className="me";
    const rc = i<3?("r"+(i+1)):"";
    tr.innerHTML=`<td class="rank ${rc}">${i+1}</td><td>${esc(row.name)}</td><td class="pts">${row.score}</td>`;
    tb.appendChild(tr);
  });
  if(!j.board.length) tb.innerHTML=`<tr><td colspan="3" class="sub" style="padding:14px">No players yet. Be the first — pick a username above.</td></tr>`;
}
async function loadChallenges(){
  const note=$("#chNote"), cats=$("#cats");
  const j=await api("/challenges?uuid="+encodeURIComponent(UUID));
  CH=j.challenges;
  if(j.phase==="pre"||j.phase==="unset"){ note.textContent = j.phase==="pre"?"Challenges unlock when the event starts.":"No event scheduled yet."; cats.innerHTML=""; return; }
  note.textContent="";
  const groups={};
  CH.forEach(c=>{(groups[c.category]=groups[c.category]||[]).push(c);});
  cats.innerHTML="";
  Object.keys(groups).sort().forEach(cat=>{
    const div=document.createElement("div"); div.className="cat";
    div.innerHTML=`<h3>${esc(cat)}</h3><div class="tiles"></div>`;
    const tiles=$(".tiles",div);
    groups[cat].forEach(c=>{
      const t=document.createElement("div"); t.className="tile"+(c.solved?" solved":"");
      t.innerHTML=`<span class="t">${esc(c.title)}</span><span class="v">${c.value}</span>`;
      t.onclick=()=>openChallenge(c.id);
      tiles.appendChild(t);
    });
    cats.appendChild(div);
  });
}
function openChallenge(id){
  const c=CH.find(x=>x.id===id); if(!c) return;
  const card=$("#modalCard");
  const hintCtl = c.has_hint ? (c.hint
      ? `<div class="hintbox"><div class="sub">Hint (unlocked)</div><div class="h">${esc(c.hint)}</div></div>`
      : `<div class="hintbox"><button id="hintBtn" class="ghost">Unlock hint (−${c.hint_cost} pts)</button></div>`) : "";
  card.innerHTML=`
    <span class="x" id="close">✕</span>
    <div class="cat-lbl">${esc(c.category)}</div>
    <h3>${esc(c.title)}</h3>
    <div class="val">${c.value} pts · ${c.solves} solve(s)</div>
    <div class="prompt">${linkify(c.prompt)}</div>
    ${c.solved
      ? `<div class="msg ok">Solved ✓</div>`
      : `<div class="row"><input type="text" id="ans" placeholder="answer" autocomplete="off"/><button class="primary" id="sub">Submit</button></div>
         <div class="sub" id="att">${c.attempts_left} attempt(s) left</div>
         <div class="msg" id="m"></div>`}
    ${hintCtl}`;
  $("#close").onclick=closeModal;
  if(!c.solved){
    const inp=$("#ans");
    $("#sub").onclick=()=>doSubmit(c.id);
    inp.onkeydown=(e)=>{if(e.key==="Enter")doSubmit(c.id);};
    inp.focus();
    tickHoldoff(c);
  }
  if(c.has_hint && !c.hint){ $("#hintBtn").onclick=()=>doHint(c.id); }
  $("#modal").classList.add("open");
}
function tickHoldoff(c){
  const btn=$("#sub"); if(!btn) return;
  const until=c.holdoff_until||0;
  const upd=()=>{const left=until-Date.now();
    if(left>0){btn.disabled=true;btn.textContent="wait "+Math.ceil(left/1000)+"s";requestAnimationFrame(()=>setTimeout(upd,250));}
    else{btn.disabled=false;btn.textContent="Submit";}};
  upd();
}
async function doSubmit(id){
  const m=$("#m"), att=$("#att"), inp=$("#ans");
  const answer=inp.value; if(!answer.trim()) return;
  try{
    const j=await api("/submit",{method:"POST",body:JSON.stringify({uuid:UUID,challenge_id:id,answer})});
    if(j.correct){
      m.className="msg ok"; m.textContent = j.scored?`Correct! +${j.points}`:"Correct (practice — event over, 0 pts)";
      await loadChallenges(); await loadBoard();
      const c=CH.find(x=>x.id===id); if(c){c.solved=true;}
      setTimeout(()=>{closeModal();},900);
    }else{
      m.className="msg bad";
      if(j.holdoff_until && (!j.attempts_left && j.attempts_left!==0)){ m.textContent="Too fast — wait for the timer."; }
      else{ m.textContent="Nope."; }
      if(j.attempts_left!=null){ att.textContent=j.attempts_left+" attempt(s) left"; }
      const c=CH.find(x=>x.id===id); if(c){c.holdoff_until=j.holdoff_until; tickHoldoff(c);}
    }
  }catch(e){ m.className="msg bad"; m.textContent=e.message; }
}
async function doHint(id){
  try{
    const j=await api("/hint",{method:"POST",body:JSON.stringify({uuid:UUID,challenge_id:id})});
    const c=CH.find(x=>x.id===id); if(c){c.hint=j.hint;}
    openChallenge(id); await loadBoard();
  }catch(e){ alert(e.message); }
}
function closeModal(){ $("#modal").classList.remove("open"); }
$("#modal").onclick=(e)=>{ if(e.target.id==="modal") closeModal(); };
$("#revealBtn").onclick=async()=>{
  try{
    const j=await api("/solutions");
    const card=$("#modalCard");
    card.innerHTML=`<span class="x" id="close">✕</span><h3>Answers</h3>`+
      j.solutions.map(s=>`<div class="prompt"><b>${esc(s.category)} — ${esc(s.title)}</b><br>${linkify(s.solution||"(none)")}</div>`).join("");
    $("#close").onclick=closeModal; $("#modal").classList.add("open");
  }catch(e){ alert(e.message); }
};

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }

async function refresh(){ try{ await loadState(); await loadBoard(); await loadChallenges(); }catch(e){ console.error(e); } }
renderIdbar();
refresh();
setInterval(loadState,1000);
setInterval(()=>{ loadBoard(); loadChallenges(); },15000);
</script>
</body>
</html>
