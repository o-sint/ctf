<style>
  :root{
    --bg:#0b0f1a; --panel:#131a2b; --panel2:#0f1524; --line:#243049;
    --ink:#e6ecff; --dim:#8090b3; --acc:#37e0a0; --acc2:#4aa3ff; --warn:#ff6b6b; --gold:#ffcf5c;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  a{color:var(--acc2)}
  .wrap{max-width:70%;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:14px}
  .brand{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.5px}
  .brand .b{color:var(--acc)}
  .status{font-family:var(--mono);font-size:13px;color:var(--dim);text-align:right}
  .status .clock{color:var(--gold);font-size:16px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}
  .pill.live{color:var(--acc);border-color:var(--acc)}
  .pill.pre{color:var(--acc2);border-color:var(--acc2)}
  .pill.post{color:var(--warn);border-color:var(--warn)}

  .idbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
  .idbar input[type=text]{padding:5px 8px;font-size:12px;max-width:140px}
  .idbar button{padding:4px 9px;font-size:12px}
  input,button{font-family:var(--mono);font-size:18px}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:9px 11px;border-radius:8px;outline:none}
  input[type=text]:focus{border-color:var(--acc2)}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    padding:9px 13px;border-radius:8px}
  button:hover{border-color:var(--acc2)}
  button.primary{background:var(--acc);color:#04150e;border-color:var(--acc);font-weight:700}
  button.ghost{background:transparent}
  button.danger{color:var(--warn);border-color:#3a2330}
  .who{font-family:var(--mono);font-size:12px}
  .who b{color:var(--acc)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0}
  .sbLegend{font-family:var(--mono);font-size:12px}

  h2{font-family:var(--mono);font-size:24px;color:var(--acc);text-transform:none;letter-spacing:1px;
    margin:26px 0 10px;font-weight:600}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;font-size:14px}
  th{color:var(--dim);font-family:var(--mono);font-weight:600;font-size:12px;background:var(--panel2)}
  tr+tr td{border-top:1px solid var(--line)}
  td.pts,th.pts{text-align:right;font-family:var(--mono)}
  .rank{font-family:var(--mono);color:var(--dim);width:56px;white-space:nowrap}
  .rank.r1{color:var(--gold)} .rank.r2{color:#cbd5e1} .rank.r3{color:#d19a66}
  .rank.r1::before{content:"🥇 "} .rank.r2::before{content:"🥈 "} .rank.r3::before{content:"🥉 "}
  .me td{background:rgba(55,224,160,.06)}

  .boardGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .boardGrid table{margin:0}
  @media(max-width:640px){.boardGrid{grid-template-columns:1fr}}
  .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .cat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .cat h3{margin:0 0 10px;font-family:var(--mono);font-size:16px;color:var(--acc2);letter-spacing:.5px}
  .tiles{display:flex;flex-direction:column;gap:8px}
  .tile{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer}
  .tile:hover{border-color:var(--acc2)}
  .tile .t{font-size:14px}
  .tile .v{font-family:var(--mono);font-size:13px;color:var(--gold)}
  .tile.solved{border-color:var(--acc)}
  .tile.solved .t::before{content:"✓ ";color:var(--acc)}
  .tile.solved .v{color:var(--acc)}
  .sub{font-size:11px;color:var(--dim);font-family:var(--mono)}

  .modal{position:fixed;inset:0;background:rgba(3,6,14,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.open{display:flex}
  .card{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card .cat-lbl{font-family:var(--mono);font-size:22px;color:var(--acc2)}
  .card h3{margin:4px 0 2px;font-size:18px;font-weight:600;color:var(--dim)}
  .card .val{font-family:var(--mono);color:var(--gold);font-size:13px}
  .prompt{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:12px;margin:14px 0;font-size:20px}
  .prompt a{word-break:break-all}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row input[type=text]{flex:1;min-width:180px}
  .msg{font-family:var(--mono);font-size:13px;min-height:18px;margin-top:8px}
  .msg.ok{color:var(--acc)} .msg.bad{color:var(--warn)} .msg.info{color:var(--dim)}
  .hintbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .hintbox .h{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin-top:8px}
  .x{float:right;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
  .foot{color:var(--dim);font-size:12px;font-family:var(--mono);text-align:center;margin:28px 0 8px}
  @media(max-width:520px){.status{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" title="Open Source Intelligence - Capture The Flag">🔎 OSINT<span class="b">//</span>CTF</div>
    <div class="status" id="status">
      <div class="idbar" id="idbar"><!-- filled by JS --></div>
      <div id="evname">—</div>
      <div><span class="clock" id="clock">--:--:--</span> <span class="pill" id="phase">…</span></div>
    </div>
  </header>

  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Scoreboard</h2>
      <span class="sub" id="sbMsg"></span>
    </div>
    <svg id="sbChart" width="100%" viewBox="0 0 900 340" style="display:block;overflow:visible;margin-top:6px"></svg>
    <div class="sbLegend row" id="sbLegend" style="margin-top:6px"></div>
  </div>

  <h2>Leaderboard</h2>
  <div id="boardWrap" class="boardGrid">
    <table id="board1"><thead><tr><th class="rank">#</th><th>Player</th><th class="pts">Points</th></tr></thead><tbody></tbody></table>
    <table id="board2"><thead><tr><th class="rank">#</th><th>Player</th><th class="pts">Points</th></tr></thead><tbody></tbody></table>
  </div>

  <h2>Challenges<span id="chTotal"></span></h2>
  <div id="chArea"><div class="sub" id="chNote">loading…</div><div class="catgrid" id="cats"></div></div>

  <div class="foot">no accounts · username stored in your browser · clearing site data resets your identity · shamelessly vibe coded</div>
</div>

<div class="modal" id="modal">
  <div class="card" id="modalCard"></div>
</div>

<script>
/* ============ CONFIG ============ */
const API = "/api"; // same host as GitHub Pages via Worker route. If using a separate api subdomain, set full URL e.g. "https://ctf-api.example.com/api"
/* ================================ */

const $ = (s,r=document)=>r.querySelector(s);
const uuidKey="ctf_uuid", nameKey="ctf_name";
let UUID = localStorage.getItem(uuidKey);
if(!UUID){ UUID = (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()); localStorage.setItem(uuidKey,UUID); }
let NAME = localStorage.getItem(nameKey) || "";
let STATE=null, CH=[], ICONS={};

async function api(path,opts={}){
  const r = await fetch(API+path,{headers:{"Content-Type":"application/json"},...opts});
  const j = await r.json().catch(()=>({error:"bad response"}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
const fmt=(ms)=>{ if(ms<0)ms=0; const s=Math.floor(ms/1000); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return [h,m,ss].map(x=>String(x).padStart(2,"0")).join(":"); };

function renderIdbar(){
  const bar=$("#idbar");
  if(NAME){
    bar.innerHTML=`<span class="who">playing as: <b>${esc(NAME)}</b></span>
      <button id="editName" class="ghost">Change name</button>
      <button id="delName" class="danger">Remove me</button>`;
    $("#editName").onclick=()=>promptName(NAME);
    $("#delName").onclick=removeMe;
  }else{
    bar.innerHTML=`<input type="text" id="nameIn" placeholder="pick a username" maxlength="24" />
      <button id="joinBtn" class="primary">Join</button>
      <span class="sub" id="joinMsg"></span>`;
    $("#joinBtn").onclick=()=>promptName($("#nameIn").value);
    $("#nameIn").onkeydown=(e)=>{if(e.key==="Enter")promptName($("#nameIn").value);};
  }
}
async function promptName(v){
  const name=(v||"").trim(); if(!name) return;
  try{
    const j=await api("/register",{method:"POST",body:JSON.stringify({uuid:UUID,name})});
    NAME=j.name; localStorage.setItem(nameKey,NAME); renderIdbar(); loadBoard(); loadScoreboard();
  }catch(e){ const m=$("#joinMsg"); if(m){m.textContent=e.message;m.className="sub bad";} else alert(e.message); }
}
async function removeMe(){
  if(!confirm("Remove your username and all your solves?")) return;
  try{ await api("/unregister",{method:"POST",body:JSON.stringify({uuid:UUID})}); }catch(e){}
  NAME=""; localStorage.removeItem(nameKey); renderIdbar(); loadBoard(); loadChallenges(); loadScoreboard();
}

async function loadState(){
  STATE=await api("/state");
  $("#evname").textContent=STATE.name||"(unnamed event)";
  const ph=$("#phase"); ph.className="pill "+STATE.phase;
  const c=$("#clock");
  const drift=Date.now()-STATE.now;
  if(STATE.phase==="pre"){ph.textContent="starts soon"; c.textContent=fmt(STATE.start-(Date.now()-drift));}
  else if(STATE.phase==="live"){ph.textContent="LIVE"; c.textContent=fmt(STATE.end-(Date.now()-drift));}
  else if(STATE.phase==="post"){ph.textContent="ended"; c.textContent="00:00:00";}
  else{ph.textContent="not scheduled"; c.textContent="--:--:--";}
}
async function loadBoard(){
  const j=await api("/leaderboard");
  const tb1=$("#board1 tbody"), tb2=$("#board2 tbody");
  tb1.innerHTML=""; tb2.innerHTML="";
  if(!j.board.length){
    tb1.innerHTML=`<tr><td colspan="3" class="sub" style="padding:14px">No players yet. Be the first — pick a username above.</td></tr>`;
    $("#board2").style.display="none";
    return;
  }
  $("#board2").style.display="";
  const half=Math.ceil(j.board.length/2);
  j.board.forEach((row,i)=>{
    const tr=document.createElement("tr");
    if(row.name===NAME) tr.className="me";
    const rc = i<3?("r"+(i+1)):"";
    tr.innerHTML=`<td class="rank ${rc}">${i+1}</td><td>${esc(row.name)}</td><td class="pts">${row.score}</td>`;
    (i<half?tb1:tb2).appendChild(tr);
  });
  $("#board2").style.display=tb2.children.length?"":"none";
}
const SB_COLORS=["#37e0a0","#4aa3ff","#ffcf5c","#ff6b6b","#c792ea","#7fd1ff","#f78c6c","#82aaff","#c3e88d","#ff9cac"];
function fmtTick(ms){ const d=new Date(ms); const p=n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function niceMax(n){ if(n<=0)return 10; const mag=Math.pow(10,Math.floor(Math.log10(n)));
  const norm=n/mag; const step=norm<=1?1:norm<=2?2:norm<=5?5:10; return step*mag; }

async function loadScoreboard(){
  try{
    const [board,tl]=await Promise.all([api("/leaderboard"),api("/timeline")]);
    const solves=(tl.solves||[]).slice().sort((a,b)=>a.ts_ms-b.ts_ms);
    const byName={};
    solves.forEach(s=>{(byName[s.name]=byName[s.name]||[]).push(s);});
    const top=board.board.filter(b=>b.solves>0).slice(0,10);
    $("#sbMsg").textContent = board.board.length ? board.board.length+" player"+(board.board.length===1?"":"s") : "";
    drawWorm(top, byName, tl.event||{}, solves);
  }catch(e){ /* leave prior chart in place on transient error */ }
}
function drawWorm(top, byName, event, allSolves){
  const svg=$("#sbChart");
  const W=900,H=340,padL=46,padR=100,padT=14,padB=34;
  svg.innerHTML="";
  $("#sbLegend").innerHTML="";
  if(!top.length || !allSolves.length){
    svg.innerHTML=`<text x="${W/2}" y="${H/2}" fill="#8090b3" font-family="monospace" font-size="13" text-anchor="middle">no scored solves yet</text>`;
    return;
  }
  const tsAll=allSolves.map(s=>s.ts_ms);
  const xMin=event.start||Math.min(...tsAll);
  const latest=Math.max(Date.now(),...tsAll);
  const xEnd=Math.max(xMin+1, event.end&&event.end>xMin?Math.min(event.end,latest):latest);
  const maxScore=niceMax(Math.max(...top.map(b=>b.score),1));
  const x=(ms)=>padL+((ms-xMin)/(xEnd-xMin||1))*(W-padL-padR);
  const xc=(ms)=>x(Math.max(xMin,Math.min(xEnd,ms))); // clamp to the visible window so solves from an older imported event don't push the line off-chart
  const y=(v)=>H-padB-(v/maxScore)*(H-padT-padB);

  let svgEls="";
  for(let i=0;i<=4;i++){
    const v=Math.round(maxScore*i/4);
    const yy=y(v);
    svgEls+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#243049" stroke-width="1"/>`;
    svgEls+=`<text x="${padL-8}" y="${yy+4}" fill="#8090b3" font-family="monospace" font-size="11" text-anchor="end">${v}</text>`;
  }
  [xMin,(xMin+xEnd)/2,xEnd].forEach(t=>{
    svgEls+=`<text x="${x(t)}" y="${H-padB+18}" fill="#8090b3" font-family="monospace" font-size="11" text-anchor="middle">${fmtTick(t)}</text>`;
  });

  const labels=[];
  top.forEach((b,i)=>{
    const color=SB_COLORS[i%SB_COLORS.length];
    const pts=byName[b.name]||[];
    let cum=0; const path=[`M ${x(xMin)} ${y(0)}`];
    pts.forEach(s=>{
      path.push(`L ${xc(s.ts_ms)} ${y(cum)}`);
      cum+=s.points;
      path.push(`L ${xc(s.ts_ms)} ${y(cum)}`);
    });
    path.push(`L ${x(xEnd)} ${y(cum)}`);
    svgEls+=`<path d="${path.join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(s=>{
      let c2=0; for(const p of pts){ c2+=p.points; if(p===s)break; }
      svgEls+=`<circle cx="${xc(s.ts_ms)}" cy="${y(c2)}" r="2.5" fill="${color}"/>`;
    });
    const label=b.name.length>13?b.name.slice(0,12)+"…":b.name;
    labels.push({y:y(cum),color,label});
  });
  labels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<labels.length;i++){
    if(labels[i].y-labels[i-1].y<13) labels[i].y=labels[i-1].y+13;
  }
  labels.forEach(l=>{ svgEls+=`<text x="${x(xEnd)+4}" y="${l.y+3}" fill="${l.color}" font-family="monospace" font-size="11">${esc(l.label)}</text>`; });
  svg.innerHTML=svgEls;

  $("#sbLegend").innerHTML=top.map((b,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">
    <span style="width:10px;height:10px;border-radius:2px;background:${SB_COLORS[i%SB_COLORS.length]};display:inline-block"></span>${esc(b.name)} <span class="sub">(${b.score})</span></span>`).join("");
}

async function loadChallenges(){
  const note=$("#chNote"), cats=$("#cats");
  const j=await api("/challenges?uuid="+encodeURIComponent(UUID));
  CH=j.challenges; ICONS=j.icons||{}; const icons=ICONS;
  if(j.phase==="pre"||j.phase==="unset"){ note.textContent = j.phase==="pre"?"Challenges unlock when the event starts.":"No event scheduled yet."; cats.innerHTML=""; $("#chTotal").textContent=""; return; }
  note.textContent="";
  $("#chTotal").textContent=" ("+CH.length+")";
  const groups={};
  CH.forEach(c=>{(groups[c.category]=groups[c.category]||[]).push(c);});
  cats.innerHTML="";
  Object.keys(groups).sort().forEach(cat=>{
    const div=document.createElement("div"); div.className="cat";
    const icon=icons[cat];
    div.innerHTML=`<h3>${icon?`<img src="${icon}" width="16" height="16" style="vertical-align:-3px;margin-right:6px"/>`:""}${esc(cat)}</h3><div class="tiles"></div>`;
    const tiles=$(".tiles",div);
    groups[cat].forEach(c=>{
      const t=document.createElement("div"); t.className="tile"+(c.solved?" solved":"");
      const noSolves=STATE&&STATE.phase==="live"&&c.solves===0;
      t.innerHTML=`<span class="t">${esc(c.title)}</span><span class="v"${noSolves?' style="color:var(--warn)"':""}>${c.value}</span>`;
      t.onclick=()=>openChallenge(c.id);
      tiles.appendChild(t);
    });
    cats.appendChild(div);
  });
}
function openChallenge(id){
  const c=CH.find(x=>x.id===id); if(!c) return;
  const card=$("#modalCard");
  const hintCtl = c.has_hint ? (c.hint
      ? `<div class="hintbox"><div class="sub">Hint (unlocked)</div><div class="h">${esc(c.hint)}</div></div>`
      : `<div class="hintbox"><button id="hintBtn" class="ghost">Unlock hint (−${c.hint_cost} pts)</button></div>`) : "";
  const isPost = STATE && STATE.phase==="post";
  const noSolves = STATE && STATE.phase==="live" && c.solves===0;
  const ansCtl = `<div class="hintbox">
    <button id="showAns" class="ghost"${isPost?"":' disabled title="wait for the CTF to end"'}>Show answer</button>
    <div class="h" id="ansText" style="display:none"></div>
  </div>`;
  const catIcon=ICONS[c.category];
  card.innerHTML=`
    <span class="x" id="close">✕</span>
    <div class="cat-lbl">${catIcon?`<img src="${catIcon}" width="20" height="20" style="vertical-align:-5px;margin-right:6px"/>`:""}${esc(c.category)}</div>
    <h3>${esc(c.title)}</h3>
    <div class="val"${noSolves?' style="color:var(--warn)"':""}>${c.value} pts · ${c.solves} solve(s)</div>
    <div class="prompt">${linkify(c.prompt)}</div>
    ${c.solved
      ? `<div class="msg ok">Solved ✓</div>`
      : `<div class="row"><input type="text" id="ans" placeholder="answer" autocomplete="off"/><button class="primary" id="sub">Submit</button></div>
         <div class="sub" id="att">${c.attempts_left} attempt(s) left</div>
         <div class="msg" id="m"></div>`}
    ${hintCtl}
    ${ansCtl}`;
  $("#close").onclick=closeModal;
  if(!c.solved){
    const inp=$("#ans");
    $("#sub").onclick=()=>doSubmit(c.id);
    inp.onkeydown=(e)=>{if(e.key==="Enter")doSubmit(c.id);};
    inp.focus();
    tickHoldoff(c);
  }
  if(c.has_hint && !c.hint){ $("#hintBtn").onclick=()=>doHint(c.id); }
  if(isPost){
    $("#showAns").onclick=async()=>{
      const btn=$("#showAns"), out=$("#ansText");
      btn.disabled=true; btn.textContent="Loading…";
      try{
        const sol=await solutionFor(c.id);
        out.innerHTML=linkify(sol||"(no solution recorded)");
        out.style.display="block";
        btn.style.display="none";
      }catch(e){ btn.disabled=false; btn.textContent="Show answer"; alert(e.message); }
    };
  }
  $("#modal").classList.add("open");
}
function tickHoldoff(c){
  const btn=$("#sub"); if(!btn) return;
  const until=c.holdoff_until||0;
  const upd=()=>{const left=until-Date.now();
    if(left>0){btn.disabled=true;btn.textContent="wait "+Math.ceil(left/1000)+"s";requestAnimationFrame(()=>setTimeout(upd,250));}
    else{btn.disabled=false;btn.textContent="Submit";}};
  upd();
}
async function doSubmit(id){
  const m=$("#m"), att=$("#att"), inp=$("#ans");
  const answer=inp.value; if(!answer.trim()) return;
  try{
    const j=await api("/submit",{method:"POST",body:JSON.stringify({uuid:UUID,challenge_id:id,answer})});
    if(j.correct){
      m.className="msg ok"; m.textContent = j.scored?`Correct! +${j.points}`:"Correct (practice — event over, 0 pts)";
      await loadChallenges(); await loadBoard(); await loadScoreboard();
      const c=CH.find(x=>x.id===id); if(c){c.solved=true;}
      setTimeout(()=>{closeModal();},900);
    }else{
      m.className="msg bad";
      if(j.holdoff_until && (!j.attempts_left && j.attempts_left!==0)){ m.textContent="Too fast — wait for the timer."; }
      else{ m.textContent="Nope."; }
      if(j.attempts_left!=null){ att.textContent=j.attempts_left+" attempt(s) left"; }
      const c=CH.find(x=>x.id===id); if(c){c.holdoff_until=j.holdoff_until; tickHoldoff(c);}
    }
  }catch(e){ m.className="msg bad"; m.textContent=e.message; }
}
async function doHint(id){
  try{
    const j=await api("/hint",{method:"POST",body:JSON.stringify({uuid:UUID,challenge_id:id})});
    const c=CH.find(x=>x.id===id); if(c){c.hint=j.hint;}
    openChallenge(id); await loadBoard(); await loadScoreboard();
  }catch(e){ alert(e.message); }
}
function closeModal(){ $("#modal").classList.remove("open"); }
$("#modal").onclick=(e)=>{ if(e.target.id==="modal") closeModal(); };

let SOLUTIONS_CACHE=null;
async function solutionFor(id){
  if(!SOLUTIONS_CACHE){
    const j=await api("/solutions");
    SOLUTIONS_CACHE={}; j.solutions.forEach(s=>{SOLUTIONS_CACHE[s.id]=s.solution;});
  }
  return SOLUTIONS_CACHE[id];
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }

async function refresh(){ try{ await loadState(); await loadBoard(); await loadChallenges(); await loadScoreboard(); }catch(e){ console.error(e); } }
renderIdbar();
refresh();
setInterval(loadState,1000);
setInterval(()=>{ loadBoard(); loadChallenges(); loadScoreboard(); },15000);
</script>
